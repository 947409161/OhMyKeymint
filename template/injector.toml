# Every app caller is routed according to the per-method `[intercept]` settings
# below. System identities stay on System; there is no package or UID routing
# list.

version = 1

[main]
enabled = true
log_level = "debug"
# Extra delay before challenged OMK generation, [minimum, maximum] ms each 0..250;
# [0, 0] disables it. Kept on so a challenged generation costs measurably more than
# a plain one, and sampled per call so that extra cost varies.
attestation_generation_delay_ms = [20, 30]
# Optional delay before two-way OMK createOperation calls, 0..250 ms; 0 disables it.
operation_start_delay_ms = 0

[intercept]
get_security_level = true
get_key_entry = true
update_subcomponent = true
list_entries = true
delete_key = true
grant = true
ungrant = true
get_number_of_entries = true
list_entries_batched = true
get_supplementary_attestation_info = true
